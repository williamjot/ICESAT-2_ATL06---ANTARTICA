[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thwaites-icesat2"
version = "0.1.0"
description = "Pipeline de produção para monitoramento da Geleira Thwaites com ICESat-2 (ATL06)"
requires-python = ">=3.11"
authors = [{ name = "Projeto PIBIC Thwaites / UnB" }]

# Dependências já presentes no ambiente (Fases 0-3).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",        # backend Parquet (formato leve de pontos)
    "scipy>=1.11",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "cartopy>=0.22",
    "earthaccess>=0.11",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "xarray>=2024.0",     # cubos de série temporal (nó x tempo)
    "netCDF4>=1.6",
    "zarr>=2.16",         # grades temporais em disco
    "dask>=2024.0",
    "statsmodels>=0.14",  # decomposição sazonal (STL) — Fase 7
    "tqdm>=4.66",
    "pydantic>=2.5",      # validação de configuração
    "pyyaml>=6.0",        # arquivos de config
    "loguru>=0.7",        # logging estruturado
]

# Dependências ADICIONAIS a instalar quando as fases científicas chegarem.
# Instale com:  pip install -e ".[analysis]"
[project.optional-dependencies]
analysis = [
    # Instalado e EM USO: maré CATS2008 (thwaites/corrections/cats_tide.py)
    "pytmd>=3.0",
    # Opcionais — o pipeline NÃO depende deles hoje:
    #  - Mann-Kendall/Sen são feitos com scipy+statsmodels (thwaites/timeseries/trend.py);
    #    o pymannkendall só é necessário para as variantes SAZONAIS (ciclo anual, Fase 7).
    #  - a krigagem ordinária e o variograma são implementados no próprio pacote
    #    (thwaites/interp/), então PyKrige/scikit-gstat servem só para conferência cruzada.
    "pymannkendall>=1.4",
    "pykrige>=1.7",
    "scikit-gstat>=1.0",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["thwaites*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
